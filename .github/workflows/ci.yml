name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Lint · Typecheck · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # NOTE: `cache: npm` is intentionally omitted — there is no
          # package-lock.json yet (local install was blocked by an AV SSL proxy).
          # Re-enable caching once a lockfile is committed, and switch
          # `npm install` below to `npm ci`.

      # No lockfile yet → `npm install`. Switch to `npm ci` once package-lock.json exists.
      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          # Placeholders so the build never depends on real secrets.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
