name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Typecheck · Lint · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # NOTE: `cache: npm` is intentionally omitted — there is no
          # package-lock.json yet (local install was blocked by an AV SSL proxy).
          # Re-enable caching once a lockfile is committed, and switch
          # `npm install` below to `npm ci`.

      # Runs before anything needs node_modules: the QA scripts are plain .mjs
      # with no dependencies, and a typo in one of them is otherwise only
      # discoverable by running it against production.
      - name: Syntax-check the QA scripts
        run: |
          set -e
          for f in scripts/qa/*.mjs; do node --check "$f"; done
          echo "QA scripts parse cleanly"

      # Typecheck comes before lint: `tsc --noEmit` is the strictest and the
      # cheapest signal, and it is the same gate the Vercel build enforces.
      - name: Install dependencies
        run: npm install

      # Both checks copy their raw output into the job summary. That is not
      # decoration: `tsc` and `eslint` write plain text into a log nobody can read
      # without a token, and the summary is the one channel the exact findings
      # come back through when the API is queried anonymously.
      - name: Typecheck
        run: |
          set +e
          npm run typecheck > typecheck.log 2>&1
          status=$?
          cat typecheck.log
          {
            echo "### Typecheck (exit $status)"
            echo '```'
            cat typecheck.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Lint
        run: |
          set +e
          npm run lint > lint.log 2>&1
          status=$?
          cat lint.log
          {
            echo "### Lint (exit $status)"
            echo '```'
            cat lint.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Build
        run: npm run build
        env:
          # Placeholders so the build never depends on real secrets.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
